services:
  db:
    environment:
      POSTGRES_DB: indoor
      POSTGRES_USER: indoor
      POSTGRES_PASSWORD: indoor
    ports:
      - "5433:5432"

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.local
    environment:
      SPRING_PROFILES_ACTIVE: local
      POSTGRES_USER: indoor
      POSTGRES_PASSWORD: indoor
      PYTHON_BRIDGE_ENABLED: "${PYTHON_BRIDGE_ENABLED:-true}"
      PYTHON_ML_DEVICE: "${PYTHON_ML_DEVICE:-cpu}"
    volumes:
      - app-storage:/data/storage
      - ./test-fixtures/captured:/app/test-fixtures/captured

volumes:
  db-data:
  app-storage:
    external: true
    name: indoor-vps-v2_app-storage
