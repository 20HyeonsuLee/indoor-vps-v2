name: Chore
description: 리팩터링·인프라·문서·테스트 등 기능 외 작업
title: "chore(<scope>): <subject>"
labels: ["type:chore", "status:triage"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: 작업 종류
      options:
        - refactor
        - infra
        - docs
        - test
        - dependency
        - cleanup
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: 목적
      description: 왜 지금 하는가. 어떤 risk/cost를 줄이는가.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 어떤 파일/모듈/문서를 손대는가.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      description: 무엇이 되면 닫을 수 있는가.
    validations:
      required: true
  - type: textarea
    id: refs
    attributes:
      label: Refs
